name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: eezoc            # this repository beside its dependencies: the workspace layout the mkfiles assume (../libeezo, ...)
      - uses: Levalicious/mk@8b33eaa94d5ae53a70b0f3b2cfd9fb1432f8cc9e
      - uses: Levalicious/mkroot@f7addbfe0a8b91de9ef1e0247453f058e3d3fc3a
      - name: dependencies at the commits deps.lock pins
        run: sh eezoc/ci/deps.sh
      - name: build, dependencies first
        run: for d in libeezo eezo eezoc; do (cd $d && mk) || exit 1; done
      - name: the standard library where eezoc looks for imports ($PREFIX/share/eezo/stdlib)
        run: (cd stdlib && mk install)
      - name: suites
        run: for t in e2e modes gc_regress stream io xbcl; do bash eezoc/tests/$t.sh || exit 1; done
